# Gutness: recognizes audiobooks by listening, then organizes them.
#   1. docker compose up -d
#   2. Open http://<this machine>:8078, add your audiobook folders on the
#      Settings tab (e.g. /mnt/user/audiobooks), then press Scan on the Queue tab.
# Everything is set on the Settings tab and kept in ./data/gutness.db.
# The first start downloads the Whisper and LLM models, which takes a while.

services:
  gutness:
    image: ghcr.io/pmow/gutness:latest
    ports:
      - "8078:8078"                   # keep both sides equal to GUTNESS_PORT
    environment:
      GUTNESS_PORT: "8078"            # the only setting outside the web UI
    volumes:
      - ./data:/data                  # database, samples, undo journals
      # Server folders visible at the same paths; pick libraries in Settings.
      # Write access is used only by the final organize step.
      - /mnt:/mnt
      - /media:/media
      - /home:/home
      - /srv:/srv
    depends_on: [whisper, ollama]
    restart: unless-stopped

  whisper:                            # Settings > Services > Whisper URL: http://whisper:9000
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: base.en              # tiny.en is faster, small.en more accurate
    volumes:
      - whisper-cache:/root/.cache
    restart: unless-stopped

  ollama:                             # Settings > Services > LLM URL: http://ollama:11434
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped

volumes:
  whisper-cache:
  ollama:
